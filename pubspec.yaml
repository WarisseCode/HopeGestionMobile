name: hope_gestion_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # Ne sert plus qu'à Syne (logo-texte AuthLogo/onboarding et titres des
  # écrans d'auth) : le reste de l'app utilise DejaVu Sans, police locale
  # (voir la section fonts: plus bas). À retirer avec le chantier logo.
  google_fonts: ^8.2.1
  flutter_lucide: ^1.46.0

  # Client HTTP pour brancher le backend HopeGestionV2 (voir lib/core/network/).
  dio: ^5.11.1
  # Stockage chiffré des tokens (Keystore Android / Keychain iOS). v11+ requiert
  # minSdk 24, déjà satisfait par le minSdk par défaut de ce projet (flutter.minSdkVersion).
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  # Connexion Google native (idToken envoyé à POST /auth/mobile/google). API
  # v7 : GoogleSignIn.instance.initialize(...) puis authenticate().
  google_sign_in: ^7.2.0
  # Pad de signature du bail (POST /locations/:id/sign) : canvas pur Dart,
  # aucun code natif, export PNG direct (toPngBytes). Tire flutter_svg
  # (pur Dart également), utilisé par son export SVG que l'app n'appelle pas.
  signature: ^6.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Double officiel de flutter_secure_storage pour les tests (voir
  # test/core/network/token_storage_test.dart) : dépendance transitive de
  # flutter_secure_storage, déclarée ici explicitement car importée
  # directement dans les tests.
  flutter_secure_storage_platform_interface: ^2.1.1

  # Double officiel de shared_preferences pour les tests
  # (InMemorySharedPreferencesAsync, voir test/features/onboarding/) : même
  # raison que flutter_secure_storage_platform_interface ci-dessus.
  shared_preferences_platform_interface: ^2.4.2

  # Double officiel de url_launcher pour les tests (FakeUrlLauncher, voir
  # test/support/fake_url_launcher.dart) : même raison que
  # flutter_secure_storage_platform_interface ci-dessus.
  url_launcher_platform_interface: ^2.3.2

  # Double officiel d'image_picker pour les tests (DepenseScreen, voir
  # test/features/finances/screens/depense_screen_test.dart) : même raison
  # que flutter_secure_storage_platform_interface ci-dessus.
  image_picker_platform_interface: ^2.11.1

  # Double de google_sign_in pour les tests (FakeGoogleSignInPlatform, voir
  # test/features/auth/data/auth_repository_google_test.dart) : même raison
  # que flutter_secure_storage_platform_interface ci-dessus.
  google_sign_in_platform_interface: ^3.1.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Onboarding & general image assets
  assets:
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Police de la charte graphique : DejaVu Sans 2.37, auto-hébergée (licence
  # libre Bitstream Vera, modifications DejaVu dans le domaine public, voir
  # assets/fonts/DejaVuSans-LICENSE.txt). Seules les graisses Regular (400)
  # et Bold (700) existent : les w500/w600 encore demandés par le code sont
  # rendus avec la graisse disponible la plus proche (400 ou 700).
  fonts:
    - family: DejaVu Sans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
